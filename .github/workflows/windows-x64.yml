name: Windows x64 native

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset:
          - windows-x64-debug
          - windows-x64-release
          - windows-x64-asan
          - windows-x64-ubsan
          - windows-x64-coverage

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up CMake 4.4 (Visual Studio 18 2026 generator support)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.4.2

      - name: Ensure Visual Studio 2026 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & scripts/ensure-vs2026.ps1 -Quiet

      - name: Verify changed-file whitespace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          } else {
            git diff --check HEAD^ HEAD
          }

      - name: Acquire pinned Microsoft D3DX compatibility package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageUri = 'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8'
          $expectedSha256 = 'EAD0906AE8A26C18A7525DA7490127A2110F7C58F18293738283E30E97C6EA4B'
          $archive = Join-Path $PWD 'out/deps/Microsoft.DXSDK.D3DX.zip'
          $destination = Join-Path $PWD 'out/deps/dxsdk'
          New-Item -ItemType Directory -Path (Split-Path $archive) -Force | Out-Null
          Invoke-WebRequest -Uri $packageUri -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "D3DX package SHA-256 mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset ${{ matrix.preset }} --fresh `
            -DDBP_DXSDK_ROOT="$PWD/out/deps/dxsdk"

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: pwsh
        env:
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --preset ${{ matrix.preset }}

      - name: Run language conformance
        if: matrix.preset == 'windows-x64-release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DBP_CONFORMANCE_COMPILER = `
            "$PWD/out/build/windows-x64-release/bin/Release/DBPCompiler.exe"
          $env:DBP_CONFORMANCE_RUNTIME_ROOT = "$PWD/Install/Compiler"
          $result = Invoke-Pester `
            -Path tests/conformance/run-conformance.Tests.ps1 `
            -PassThru
          if ($result.FailedCount -ne 0) {
            throw "Language conformance failed: $($result.FailedCount) test(s)."
          }

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}-test-diagnostics
          path: |
            out/build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    runs-on: windows-2025
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up CMake 4.4 (Visual Studio 18 2026 generator support)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.4.2

      - name: Ensure Visual Studio 2026 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & scripts/ensure-vs2026.ps1 -Quiet

      - name: Acquire pinned Microsoft D3DX compatibility package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageUri = 'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8'
          $expectedSha256 = 'EAD0906AE8A26C18A7525DA7490127A2110F7C58F18293738283E30E97C6EA4B'
          $archive = Join-Path $PWD 'out/deps/Microsoft.DXSDK.D3DX.zip'
          $destination = Join-Path $PWD 'out/deps/dxsdk'
          New-Item -ItemType Directory -Path (Split-Path $archive) -Force | Out-Null
          Invoke-WebRequest -Uri $packageUri -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "D3DX package SHA-256 mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset windows-x64-coverage --fresh `
            -DDBP_DXSDK_ROOT="$PWD/out/deps/dxsdk"

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build --preset windows-x64-coverage

      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --preset windows-x64-coverage --output-on-failure

      - name: Generate coverage report
        shell: pwsh
        run: |
          & scripts/coverage-report.ps1 -BuildDirectory out/build/windows-x64-coverage -OutputFormat text

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            out/build/windows-x64-coverage/**/*.cov
            coverage-report.*
          if-no-files-found: ignore
          retention-days: 14

  fuzz-corpus-smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up CMake 4.4 (Visual Studio 18 2026 generator support)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.4.2

      - name: Ensure Visual Studio 2026 toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & scripts/ensure-vs2026.ps1 -Quiet

      - name: Acquire pinned Microsoft D3DX compatibility package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageUri = 'https://www.nuget.org/api/v2/package/Microsoft.DXSDK.D3DX/9.29.952.8'
          $expectedSha256 = 'EAD0906AE8A26C18A7525DA7490127A2110F7C58F18293738283E30E97C6EA4B'
          $archive = Join-Path $PWD 'out/deps/Microsoft.DXSDK.D3DX.zip'
          $destination = Join-Path $PWD 'out/deps/dxsdk'
          New-Item -ItemType Directory -Path (Split-Path $archive) -Force | Out-Null
          Invoke-WebRequest -Uri $packageUri -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $expectedSha256) {
            throw 'D3DX package SHA-256 mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination

      - name: Configure Clang libFuzzer targets
        shell: pwsh
        run: |
          cmake -S . -B out/build/windows-x64-fuzz `
            -G "Visual Studio 18 2026" -A x64 -T ClangCL `
            -DDBP_BUILD_FUZZERS=ON -DBUILD_TESTING=OFF `
            -DDBP_DXSDK_ROOT="$PWD/out/deps/dxsdk"

      - name: Build fuzz targets
        shell: pwsh
        run: |
          cmake --build out/build/windows-x64-fuzz `
            --config Release `
            --target dbp_package_reader_fuzzer `
              dbp_legacy_pck_reader_fuzzer `
              dbp_fuzz_seed_generator `
              dbp_codegen_fuzzer `
              dbp_codegen_seed_generator

      - name: Run bounded valid and malformed corpus smoke
        shell: pwsh
        run: |
          ./fuzz/run-corpus-smoke.ps1 `
            -BinaryDirectory out/build/windows-x64-fuzz/bin/Release

      - name: Run bounded codegen corpus smoke
        shell: pwsh
        run: |
          ./fuzz/run-codegen-corpus-smoke.ps1 `
            -BinaryDirectory out/build/windows-x64-fuzz/bin/Release

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install clang-tidy
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-tidy

      - name: Verify clang-tidy configuration
        shell: bash
        run: |
          if [ ! -f .clang-tidy ]; then
            echo "::error::.clang-tidy configuration file missing"
            exit 1
          fi
          clang-tidy --version
          echo "clang-tidy configuration validated"

      - name: Run clang-tidy on compiler sources
        shell: bash
        run: |
          # Run clang-tidy on a subset of critical source files.
          # The full build requires Windows/DirectX SDK, but clang-tidy
          # can analyze individual translation units for bugprone patterns.
          set +e
          clang-tidy \
            --config-file=.clang-tidy \
            --checks='-*,bugprone-*' \
            DBProCompiler/DBPCompiler/ASMWriter.cpp \
            DBProCompiler/DBPCompiler/DBPCompiler.cpp \
            DBProCompiler/DBPCompiler/Declaration.cpp \
            2>&1 | tee clang-tidy-output.txt
          exit_code=${PIPESTATUS[0]}
          # Don't fail the build on warnings yet - this is an incremental adoption
          echo "clang-tidy analysis complete (exit code: $exit_code)"
          exit 0
